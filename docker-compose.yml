# Hosted-mode deployment.
#
# Caddy terminates TLS (Let's Encrypt) and reverse-proxies to the MCP
# container. Registrations persist to a named volume so they survive
# container rebuilds.
#
# Required environment (set via .env or your orchestrator):
#   ELABFTW_BASE_URL     — the eLabFTW instance users register against
#                          (also the allow-list unless MCP_ALLOWED_BASE_URLS is set)
#   MCP_PUBLIC_URL       — public origin used in personal URLs and for the
#                          Host/Origin allow-list (https://mcp.example.tum.de)
#   MCP_DOMAIN           — bare hostname for Caddy's automatic TLS (mcp.example.tum.de)
#
# Strongly recommended:
#   MCP_STORE_KEY        — 32-byte key (base64/hex) encrypting stored API keys.
#                          Unset → a key file is generated on the data volume.
#
# Optional: MCP_ALLOWED_BASE_URLS, MCP_ALLOWED_HOSTS, MCP_ALLOWED_ORIGINS,
# MCP_TRUST_PROXY, MCP_MAX_SESSIONS, MCP_MAX_SESSIONS_PER_TOKEN,
# MCP_MAX_TOKENS_PER_USER, and the ELABFTW_* permission caps. See .env.example.

services:
  mcp-elabftw:
    build:
      context: .
    image: elabftw-mcp:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ELABFTW_BASE_URL: ${ELABFTW_BASE_URL:?must be set}
      MCP_ALLOWED_BASE_URLS: ${MCP_ALLOWED_BASE_URLS:-}
      # Operator-level caps; per-token opt-ins are AND-ed against these.
      ELABFTW_ALLOW_WRITES: ${ELABFTW_ALLOW_WRITES:-false}
      ELABFTW_ALLOW_DESTRUCTIVE: ${ELABFTW_ALLOW_DESTRUCTIVE:-false}
      ELABFTW_REVEAL_USER_IDENTITIES: ${ELABFTW_REVEAL_USER_IDENTITIES:-false}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?must be set, e.g. https://<MCP_DOMAIN>}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Caddy is the single proxy hop in front of the app.
      MCP_TRUST_PROXY: ${MCP_TRUST_PROXY:-1}
      MCP_STORE_BACKEND: ${MCP_STORE_BACKEND:-json}
      MCP_REGISTRATIONS_PATH: ${MCP_REGISTRATIONS_PATH:-/var/lib/elabftw-mcp/registrations.json}
      MCP_STORE_KEY: ${MCP_STORE_KEY:-}
      MCP_MAX_SESSIONS: ${MCP_MAX_SESSIONS:-500}
      MCP_MAX_SESSIONS_PER_TOKEN: ${MCP_MAX_SESSIONS_PER_TOKEN:-5}
      MCP_MAX_TOKENS_PER_USER: ${MCP_MAX_TOKENS_PER_USER:-20}
    volumes:
      - mcp_registrations:/var/lib/elabftw-mcp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp-elabftw

volumes:
  mcp_registrations:
  caddy_data:
  caddy_config:
